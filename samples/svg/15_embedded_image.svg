<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="200" viewBox="0 0 320 200">
  <!-- base64埋め込み画像（対応）と外部参照画像（非対応→無視）。原寸 320×200 -->
  <rect width="320" height="200" fill="#e0e1dd"/>
  <image x="20" y="20" width="160" height="160" xlink:href="data:image/png;base64,"/>
  <image x="200" y="40" width="100" height="100" xlink:href="external_not_loaded.png"/>
  <rect x="200" y="40" width="100" height="100" fill="none" stroke="#415a77" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
