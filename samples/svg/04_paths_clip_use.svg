<?xml version="1.0" encoding="UTF-8"?>
<!-- path（曲線・円弧）、clipPath、transform、use、破線。原寸 480×320 -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <clipPath id="round">
      <circle cx="120" cy="160" r="100"/>
    </clipPath>
    <path id="star" d="M0,-30 L9,-9 L30,-9 L13,5 L19,27 L0,14 L-19,27 L-13,5 L-30,-9 L-9,-9 Z" fill="#ffd400" stroke="#8a6d00" stroke-width="2"/>
  </defs>
  <rect width="480" height="320" fill="#1d1f2b"/>
  <g clip-path="url(#round)">
    <rect x="0" y="60" width="240" height="100" fill="#e4572e"/>
    <rect x="0" y="160" width="240" height="100" fill="#2a7ac8"/>
  </g>
  <path d="M260,260 C300,60 400,60 440,260" fill="none" stroke="#7fdbca" stroke-width="5" stroke-dasharray="14 8"/>
  <path d="M270,60 A40,40 0 1,1 350,60" fill="none" stroke="#ff7eb6" stroke-width="6"/>
  <use xlink:href="#star" x="300" y="170"/>
  <use xlink:href="#star" transform="translate(400 170) rotate(20) scale(1.4)"/>
</svg>
